# MOVE THIS FILE to .github/workflows/check-credential-logging.yml to activate
# the CI gate. It lives under scripts/ only because this repo has no .github
# directory at all and the PAT used to open PRs here lacks the GitHub
# `workflow` scope, so no file can be pushed under .github/workflows/.
# A maintainer with workflow scope should `git mv` it into place (contents are
# final and correct as-is). Same parking pattern as
# scripts/check-emdash.github-workflow.yml and
# scripts/typecheck.github-workflow.yml.
#
# What it guards: a console.* call may not reference an identifier holding a
# credential (bearer/refresh/invite/magic-link/guest token, Authorization
# header, password) and may not log a whole identity object. A token PREFIX is
# not a redaction. See scripts/check-credential-logging.mjs for the rule and
# the `allow-credential-log` escape hatch.
name: check-credential-logging

on:
  pull_request:
  push:

jobs:
  check-credential-logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:credlog
