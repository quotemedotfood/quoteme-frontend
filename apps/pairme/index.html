<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PairMe</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Figtree (--font-body) and Piazzolla (--font-display), the same two faces
      Desi's landing loads (apps/pairme-landing/index.html). They are declared
      here and ONLY here; the tokens that name them live in src/lib/theme.css.
      Weights are the ones the app actually asks for: body 400/500/600/700,
      display 600/700 (see the fontTokens guard test).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Piazzolla:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#1F2A44" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
